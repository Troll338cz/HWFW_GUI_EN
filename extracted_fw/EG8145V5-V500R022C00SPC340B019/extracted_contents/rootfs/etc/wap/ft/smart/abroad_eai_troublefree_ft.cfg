# 公共特性开关，供其它所有feature开关include
#非智能单板支持EAI特性
feature.include="capi_ft.cfg"
feature.include="eai_ft.cfg"
feature.include="base_cmp_ft.cfg"

#由于预置C插件需要开启硬件统计开关，在这里开启，避免特性开关没开，导致功能问题
feature.name="FT_USERDEV_TRAFFIC_HARD_STAT" feature.enable="1" feature.attribute="1"

#是否支持EAI小类应用配置
feature.name="FT_EAI_SUPPORT_APPS_CONFIG" feature.enable="1" feature.attribute="1"

#功能： 支持TROUBLE_FREE（未登录情况下诊断并优化）
feature.name="FT_SUPPORT_TROUBLE_FREE" feature.enable="1" feature.attribute="1"

# C插件支持品质宽带的特性开关，由于开启品质宽带后会影响WIFI极限性能，所以只在部分单板开启，采用打包改名的方式, 游戏加速特性一定要开
feature.name="FT_QBB_SUPPORT" feature.enable="1"